name: Windows Simplified Chinese edition
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: Swatinem/rust-cache@v2
      - name: Add Chinese font fallback
        shell: python
        run: |
          from pathlib import Path
          p = Path('crates/phone-app/src/ui/theme.rs')
          s = p.read_text(encoding='utf-8')
          marker = '    // Semibold falls back to the regular face when no bold exists.'
          assert s.count(marker) == 1
          patch = '''    // Preserve Latin UI fonts and append a Windows Chinese fallback.
              if !bundled_only {
                  let mut candidates = Vec::new();
                  if let Some(path) = std::env::var_os("GEEKBRIDGE_CJK_FONT") {
                      candidates.push(PathBuf::from(path));
                  }
                  let root = std::env::var_os("SystemRoot").unwrap_or_else(|| "C:/Windows".into());
                  let dir = PathBuf::from(root).join("Fonts");
                  for name in ["msyh.ttc", "simsun.ttc", "msjh.ttc"] {
                      candidates.push(dir.join(name));
                  }
                  if let Some(bytes) = candidates.iter().find_map(|p| std::fs::read(p).ok()) {
                      fonts.font_data.insert("cjk-fallback".into(), Arc::new(FontData::from_owned(bytes)));
                      for family in [FontFamily::Proportional, FontFamily::Monospace] {
                          fonts.families.entry(family).or_default().push("cjk-fallback".into());
                      }
                  }
              }
          '''
          s = s.replace(marker, patch + marker)
          test = '''
              #[test]
              fn configured_cjk_font_covers_chinese_text() {
                  assert!(std::env::var_os("GEEKBRIDGE_CJK_FONT").is_some());
                  let ctx = egui::Context::default();
                  install_fonts(&ctx);
                  let _ = ctx.run(Default::default(), |ctx| {
                      ctx.fonts(|f| {
                          for family in [FontFamily::Proportional, FontFamily::Monospace, semibold_family()] {
                              for c in "中文短信来电联系人小米折叠屏".chars() {
                                  assert!(f.has_glyph(&FontId::new(14.0, family.clone()), c), "missing glyph {c} in {family:?}");
                              }
                          }
                      });
                  });
              }
          '''
          at = s.rfind('}')
          s = s[:at] + test + s[at:]
          p.write_text(s, encoding='utf-8')
      - name: Prepare verified CJK font for tests
        shell: pwsh
        run: |
          $font = Join-Path $env:RUNNER_TEMP 'NotoSansSC-Regular.otf'
          Invoke-WebRequest 'https://raw.githubusercontent.com/notofonts/noto-cjk/main/Sans/SubsetOTF/SC/NotoSansSC-Regular.otf' -OutFile $font
          if ((Get-FileHash $font -Algorithm SHA256).Hash -ne 'FAA6C9DF652116DDE789D351359F3D7E5D2285A2B2A1F04A2D7244DF706D5EA9') { throw 'Font checksum mismatch' }
          "GEEKBRIDGE_CJK_FONT=$font" >> $env:GITHUB_ENV
      - name: Localize Windows interface to Simplified Chinese
        shell: python
        run: |
          from pathlib import Path
          import json, re
          translations = json.loads(r'''{"Keypad":"拨号键盘","Contacts":"联系人","Recents":"通话记录","Messages":"短信","Settings":"设置","Phone":"手机","Call":"拨打","Message":"短信","Send":"发送","Answer":"接听","Decline":"拒接","Hang up":"挂断","Cancel":"取消","Close":"关闭","Done":"完成","Delete":"删除","Retry":"重试","Reload":"刷新","Try again":"重试","Check again":"重新检查","Reset":"恢复默认","Mute":"静音","Help":"帮助","Recent":"最近","Suggestions":"建议","All":"全部","Missed":"未接","Incoming":"呼入","Outgoing":"呼出","Unknown":"未知","Unknown caller":"未知来电","INCOMING":"来电","CALLING":"正在拨号","RINGING":"正在响铃","ON HOLD":"通话保持","ENDED":"已结束","ON CALL":"通话中","HELD":"通话保持","REC":"录音","This call is being recorded":"正在录制此通话","Audio on this computer":"使用电脑通话音频","Move the call's voice to this computer's speakers and microphone":"将通话音频切换到电脑的扬声器和麦克风","Muting is not available: the call's audio is handled by your phone and Bluetooth, not by this app":"当前无法在此静音：通话音频由手机和蓝牙处理，请在手机上操作","Search name or number":"搜索姓名或号码","NO MATCHES":"没有匹配结果","Nothing matches “{q}”.":"没有找到与“{q}”匹配的内容。","Call this number":"拨打此号码","NO PHONE":"未连接手机","Pair a phone in your system's Bluetooth settings to see its contacts.":"请在系统蓝牙设置中配对手机，以查看联系人。","PHONE OFFLINE":"手机未连接","Connect {} to load its contacts.":"连接 {} 后即可加载联系人。","COULD NOT LOAD":"加载失败","LOADING...":"正在加载…","Reading contacts from your phone.":"正在读取手机联系人。","NO CONTACTS":"没有联系人","Your phone has no contacts with a phone number.":"手机中没有包含电话号码的联系人。","NOT LOADED":"尚未加载","Contacts are loaded only when you ask.":"点击下方按钮后才会读取联系人。","Load contacts":"加载联系人","Waiting for your phone.":"正在等待手机。","{}  +{} more":"{}  另有 {} 个","Press keys to send tones":"点击按键发送拨号音","Enter a number":"输入电话号码","Number {shown}":"号码 {shown}","Paste a number":"粘贴号码","Paste a number (Ctrl+V)":"粘贴号码（Ctrl+V）","Type, paste or tap a number":"输入、粘贴号码或点击拨号键盘","Text this number":"给此号码发短信","Connect your phone to call":"连接手机后即可拨打","NO MESSAGES":"暂无短信","Texts you send and receive will show up here.":"收发的短信将显示在这里。","New message":"新建短信","New message (Ctrl+N)":"新建短信（Ctrl+N）","{name}, {unread} unread: {}":"{name}，{unread} 条未读：{}","To:":"收件人：","Could not send the text to {}: {e}":"无法向 {} 发送短信：{e}","NO CHAT OPEN":"未打开会话","Choose a conversation, or start a new message.":"请选择会话，或新建短信。","Back to conversations":"返回会话列表","Call {name}":"拨打给 {name}","Message {name}":"给 {name} 发短信","No messages yet. Say hello.":"暂无短信，发送一条问候吧。","Sending…":"正在发送…","Sent":"已发送","Reply":"回复","Name or phone number":"姓名或电话号码","Type a name from your contacts, or a full phone number.":"输入联系人姓名或完整电话号码。","Send to this number":"发送到此号码","Not delivered: why":"未送达：原因","Not delivered: {why}":"未送达：{why}","Pair a phone":"配对手机","On your phone, open Settings > Bluetooth and keep that screen open, so the phone can be found.":"在手机上打开“设置 > 蓝牙”并保持该页面开启，以便电脑发现手机。","Your phone should show the same number. Check it, then tap Pair on the phone.":"请确认手机显示相同的配对码，然后在手机上点击“配对”。","Watch your phone: it will ask you to pair.":"请查看手机并确认配对请求。","No phone found. Open Settings > Bluetooth on the phone, keep that screen open, and scan again.":"未找到手机。请打开手机“设置 > 蓝牙”，保持页面开启后重新扫描。","Pick your phone:":"选择你的手机：","Pair":"配对","Paired phones:":"已配对的手机：","Unpair":"取消配对","Scan again":"重新扫描","Paired with {name}":"已与 {name} 配对","Removing {name}…":"正在移除 {name}…","Pairing with {name}…":"正在与 {name} 配对…","Setting up calls on this computer…":"正在为电脑配置通话连接…","This takes a few seconds. Then this window tells you to switch on Calls on the phone.":"通常需要几秒钟。配置完成后，请按提示在手机上开启“通话音频”。","That did not work":"操作未成功","Scanning for phones…":"正在搜索手机…","Scanning…":"正在扫描…","One more thing for calls: on the phone open Settings > Bluetooth, tap the gear next to this computer and switch on Calls (call audio). Texts and contacts may also ask for permission on the phone: tap Allow.":"还需在手机“设置 > 蓝牙”中点击此电脑旁的详情按钮，开启“通话音频”。如手机询问短信或联系人访问权限，请按需点击“允许”。","On the iPhone open Settings > Bluetooth, tap the i next to this computer, and switch on Show Notifications and Sync Contacts. The setup guide shows each step as it comes true.":"在 iPhone“设置 > 蓝牙”中点击此电脑旁的详情按钮，开启“显示通知”和“同步通讯录”。设置向导会显示各步骤的完成情况。","Incoming · 2:15":"呼入 · 2:15","NO MISSED CALLS":"暂无未接来电","Calls you miss will show up here.":"未接来电将显示在这里。","Pair a phone in your system's Bluetooth settings.":"请在系统蓝牙设置中配对手机。","NO RECENT CALLS":"暂无通话记录","Calls you make and receive will show up here.":"拨出和接听的电话将显示在这里。","Appearance":"外观","Theme":"主题","System follows your desktop's light or dark setting.":"跟随系统的浅色或深色主题。","System":"跟随系统","Light":"浅色","Dark":"深色","Notifications":"通知","Incoming calls":"来电通知","Show an alert while the phone rings.":"手机来电时显示提醒。","Missed calls":"未接来电","Show an alert when you miss a call.":"有未接来电时显示提醒。","New texts":"新短信","Show an alert when a text arrives.":"收到新短信时显示提醒。","Quick reply":"快捷回复","Offer a reply box on text alerts.":"在短信通知中显示回复输入框。","Text alerts stay for":"短信提醒显示时长","When you do not touch them.":"未操作时自动关闭提醒的时间。","Calls":"通话","Calls only":"仅通话音频","Use Bluetooth audio for calls only. Music and videos from the phone do not play on this computer.":"蓝牙音频仅用于通话，不在电脑上播放手机的音乐和视频。","Record calls":"通话录音","Save the audio of calls on this computer.":"将通话录音保存到此电脑。","Recording a call may require the other person's consent where you live.":"根据当地规定，通话录音可能需要对方同意。","Recordings folder":"录音保存文件夹","Open folder":"打开文件夹","Could not open {}: {e}":"无法打开 {}：{e}","Use the default folder":"使用默认文件夹","Saved to {shown}":"保存到 {shown}","Automatic":"自动选择","Use the connected phone, or the first paired one.":"使用已连接的手机，或第一台已配对手机。","No paired phones. Pair your phone in your system's Bluetooth settings.":"暂无已配对手机，请先在系统蓝牙设置中配对。","Connected":"已连接","Not connected":"未连接","Find your phone, pair it, or remove a pairing, without leaving the app.":"在应用内搜索手机、配对或移除配对。","iPhone setup guide":"iPhone 设置向导","The steps that make an iPhone share texts, contacts and calls.":"引导 iPhone 开启短信、联系人共享和通话功能。","Open guide":"打开向导","Background":"后台运行","Keep running when the window is closed":"关闭窗口后继续运行","Closing minimises the window so calls and texts still arrive. Quit with Ctrl+Q.":"关闭窗口时保持后台运行，以接收来电和短信。按 Ctrl+Q 完全退出。","Start minimised":"启动时最小化","Open in the background when you log in.":"登录电脑后在后台打开。","Updates":"更新","Check for updates":"检查更新","Looks on GitHub about once a day. This is the only time the app uses the network.":"约每天从 GitHub 检查一次更新，这是应用联网的唯一用途。","Not checked yet.":"尚未检查。","Checking…":"正在检查…","You have the latest version.":"当前已是最新版本。","Version {} is available.":"发现新版本 {}。","Version {} is available":"发现新版本 {}","Installing version {v}…":"正在安装版本 {v}…","Installed version {v}; restarting.":"版本 {v} 已安装，正在重启。","Could not check: {e}":"检查失败：{e}","Installed by a package manager: update it there.":"请通过安装此应用的包管理器更新。","Version {CURRENT_VERSION}":"版本 {CURRENT_VERSION}","Update now":"立即更新","Check now":"立即检查","Contacts and messages":"联系人与短信","Load contacts when the phone connects":"手机连接后自动加载联系人","Reads your phone's contacts so names show instead of numbers.":"读取手机联系人，在来电和短信中显示姓名。","Check for new texts every":"新短信检查间隔","Shorter is quicker, longer saves your phone's battery.":"间隔越短提醒越及时，间隔越长越省手机电量。","Read them from the phone again now.":"立即从手机重新读取联系人。","Reload contacts":"刷新联系人","Diagnostics":"连接诊断","Messages link":"短信连接","Contacts link":"联系人连接","Conversations":"短信会话","{} ({} texts)":"{}（{} 条短信）","Recent calls":"近期通话","Paired phones":"已配对手机","Retry message link":"重试短信连接","About":"关于","Version {VERSION}":"版本 {VERSION}","Make and take calls and texts from your computer, over Bluetooth, with no app on the phone.":"通过蓝牙在电脑上拨打、接听电话和收发短信，手机无需安装应用。","Licence: GNU General Public License v3.0 or later.":"许可证：GNU GPL v3.0 或更高版本。","Credits: a from-scratch Rust app. The look (palette, dot-matrix type, controls) comes from the GeekBridge design system. Phone messages and contacts are read with the OBEX MAP and PBAP protocols.":"基于 Rust 开发，界面采用 GeekBridge 设计系统；通过 OBEX MAP 和 PBAP 协议读取手机短信和联系人。","Quit GeekBridge Phone":"退出 GeekBridge Phone","Reload contacts from the phone":"从手机刷新联系人","Updating to version {v}…":"正在更新到版本 {v}…","The app restarts when it is done.":"完成后应用将自动重启。","Updated to version {v}":"已更新到版本 {v}","Restarting…":"正在重启…","Could not check for updates":"无法检查更新","No phone is connected.":"当前未连接手机。","No phone":"未连接手机","Pair a phone in Bluetooth settings":"请在蓝牙设置中配对手机","Connecting…":"正在连接…","Allow on phone":"请在手机上允许访问","Messages offline":"短信连接已断开","INCOMING CALL":"来电","IN CALL":"通话中","CALL ENDED":"通话结束","PHONE CONNECTED":"手机已连接","ALLOW ACCESS":"请允许访问","MESSAGES OFFLINE":"短信连接已断开","CONNECTING":"正在连接","Incoming call":"来电","Calling":"正在拨号","Call waiting":"呼叫等待","Calling…":"正在拨号…","Ringing…":"正在响铃…","On call":"通话中","On hold":"通话保持","Call ended":"通话结束","Allow message access on your phone":"请在手机上允许短信访问","Messages are offline":"短信连接已断开","Contacts could not be loaded":"无法加载联系人","Turn on calls on your phone":"请在手机上开启通话音频","Your phone is asking whether this computer may use your messages. Tap Allow on the phone, then press Retry.":"请在手机上允许此电脑访问短信，然后点击“重试”。","On your phone: Settings > Bluetooth, tap the gear next to this computer and switch on Calls (call audio). Then ring the phone once: the call shows here and its voice comes through this computer.":"打开手机“设置 > 蓝牙”，点击此电脑旁的详情按钮并开启“通话音频”。随后拨打手机测试，来电会显示在这里，音频通过电脑播放。","Idle":"空闲","Connecting":"正在连接","Ready":"就绪","Access not allowed on the phone":"手机尚未允许访问","Failed: {why}":"失败：{why}","Set up your iPhone":"设置 iPhone","An iPhone shares texts and contacts with this computer like a car kit, once you switch them on. Four short steps; each one ticks itself off.":"按照以下四步开启 iPhone 共享，此电脑即可像车载蓝牙一样读取短信和联系人。","your iPhone":"你的 iPhone","Show Notifications":"显示通知","Sync Contacts":"同步通讯录","Don't show this again":"不再显示","All four steps are done":"四个步骤均已完成","ALL SET":"设置完成","All set. Your iPhone works like a car kit: calls, texts and contacts.":"设置完成，可以通过蓝牙使用 iPhone 的电话、短信和联系人。","Simulate incoming call (contact)":"模拟联系人来电","Simulate incoming call (unknown number)":"模拟陌生号码来电","Simulate missed call":"模拟未接来电","Disconnect the phone":"断开手机连接","Reconnect the phone":"重新连接手机","End call":"结束通话","Simulate text (contact)":"模拟联系人短信","Simulate text (unknown number)":"模拟陌生号码短信","Demo mode: a fake phone, nothing is real":"演示模式：使用虚拟手机和示例数据","now":"刚刚","Looking for phones nearby…":"正在搜索附近的手机…","Pair your iPhone":"配对 iPhone","Allow texts":"允许短信访问","Share contacts":"共享联系人","Try a call":"测试通话","this computer":"此电脑","Connected to {}.":"已连接到 {}。","Pair it in your computer's Bluetooth settings. You only do this once.":"请在电脑的蓝牙设置中配对手机，只需操作一次。","Texts are coming through.":"短信同步已正常工作。","1 contact loaded.":"已加载 1 位联系人。","{n} contacts loaded.":"已加载 {n} 位联系人。","Calls are ready.":"通话连接已就绪。","Your first call will finish this step.":"完成首次通话后，此步骤将自动完成。","The iPhone did not answer. Check Settings > Bluetooth > (i) next to “{}”, then press Check again.":"iPhone 未响应。请检查“设置 > 蓝牙”中“{}”旁的详情，然后点击“重新检查”。","On the iPhone: Settings > Bluetooth, tap (i) next to “{}”, then turn on Show Notifications.":"在 iPhone“设置 > 蓝牙”中点击“{}”旁的详情，并开启“显示通知”。","On the same screen, turn on Sync Contacts, then press Check again.":"在同一页面开启“同步通讯录”，然后点击“重新检查”。","Connected to Vali's iPhone.":"已连接到 Vali's iPhone。","250 contacts loaded.":"已加载 250 位联系人。"}''')
          root = Path('crates/phone-app/src')
          files = list((root / 'views').rglob('*.rs'))
          files += [root / x for x in ['chrome.rs', 'banners.rs', 'app.rs', 'model/status.rs', 'model/tab.rs', 'model/guide.rs']]
          files += [Path('crates/phone-overlay/src') / x for x in ['render.rs', 'state.rs', 'model.rs']]
          token = re.compile(r'//[^\n]*|/\*[\s\S]*?\*/|"(?:\\[\s\S]|[^"\\])*"')
          seen = set()
          count = 0
          for p in files:
              if not p.exists():
                  continue
              s = p.read_text(encoding='utf-8')
              def replace(m):
                  global count
                  raw = m.group()
                  if not raw.startswith('"'):
                      return raw
                  normal = re.sub(r'\\\r?\n[ \t]*', '', raw)
                  normal = re.sub(r'\\u\{([0-9A-Fa-f]+)\}', lambda u: chr(int(u.group(1),16)), normal)
                  try:
                      value = json.loads(normal)
                  except ValueError:
                      return raw
                  translated = translations.get(value)
                  if translated is None and p.name == 'guide.rs':
                      updated = value
                      for fragment in ['Show Notifications', 'Sync Contacts', 'Check again']:
                          updated = updated.replace(fragment, translations[fragment])
                      if updated != value:
                          translated = updated
                  if translated is None:
                      return raw
                  assert re.findall(r'\{[^{}]*\}', value) == re.findall(r'\{[^{}]*\}', translated), value
                  seen.add(value)
                  count += 1
                  return json.dumps(translated, ensure_ascii=False)
              s = token.sub(replace, s)
              if p.name == 'tab.rs':
                  old = '.find(|t| t.label().eq_ignore_ascii_case(s.trim()))'
                  new = '''.find(|t| {
                          let english = match t {
                              Tab::Keypad => "keypad", Tab::Contacts => "contacts", Tab::Recents => "recents",
                              Tab::Messages => "messages", Tab::Settings => "settings",
                          };
                          english.eq_ignore_ascii_case(s.trim()) || t.label() == s.trim()
                      })'''
                  assert old in s
                  s = s.replace(old,new)
              p.write_text(s, encoding='utf-8')
          # English-only dot-matrix glyphs must use the normal font for Chinese headings.
          p = root / 'ui/dotmatrix.rs'
          s = p.read_text(encoding='utf-8')
          old = '    let n = text.chars().count() as f32;'
          new = '''    if text.chars().any(|c| !c.is_ascii()) {
                  return vec2(text.chars().count() as f32 * pitch * 6.5, pitch * 6.0);
              }
          '''+old
          assert old in s
          s = s.replace(old,new,1)
          old = '    let radius = pitch * 0.36;'
          new = '''    if text.chars().any(|c| !c.is_ascii()) {
                  painter.text(origin, eframe::egui::Align2::LEFT_TOP, text,
                      eframe::egui::FontId::proportional(pitch * 6.0), on);
                  return;
              }
          '''+old
          assert old in s
          p.write_text(s.replace(old,new,1),encoding='utf-8')
          assert count > 200, count
          print(f'Translated {count} literals; {len(seen)} unique UI strings')
          print('Unused translations:', sorted(set(translations)-seen))
          
      - name: Test Chinese glyphs and application
        shell: pwsh
        run: |
          cargo test --locked -p phone-app --lib
          if ($LASTEXITCODE -ne 0) { throw 'Tests failed' }
      - name: Build signed Windows installer
        shell: pwsh
        run: |
          $cert = New-SelfSignedCertificate -Type Custom -Subject 'CN=GeekBridge' -KeyUsage DigitalSignature -FriendlyName 'GeekBridge CJK personal build' -CertStoreLocation Cert:\CurrentUser\My -NotAfter (Get-Date).AddYears(1) -TextExtension @('2.5.29.37={text}1.3.6.1.5.5.7.3.3', '2.5.29.19={text}')
          & .\packaging\windows\build-release.ps1 -Version '0.1.4' -Revision 7 -CertThumbprint $cert.Thumbprint
          if ($LASTEXITCODE -ne 0) { throw 'Build failed' }
      - uses: actions/upload-artifact@v4
        with:
          name: GeekBridge-Phone-zh-CN-Windows
          path: |
            dist/windows/*.zip
            dist/windows/*.sha256
            crates/phone-app/src/ui/theme.rs
          if-no-files-found: error
          retention-days: 14
