[package]
name = "phone-linux"
description = "Linux Bluetooth transport: a plain RFCOMM socket to a paired phone"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
libc = "0.2"
phone-obex = { path = "../phone-obex" }
phone-core = { path = "../phone-core" }
zbus = { version = "5", default-features = false, features = ["blocking-api", "async-io"] }
log = "0.4"
serde_json = "1"
