[package]
name = "phone-update"
description = "GeekBridge Phone self-update: check GitHub releases, verify a checksum and an Ed25519 signature, install"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
ed25519-dalek = { version = "2", default-features = false, features = ["std"] }
flate2 = "1"
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tar = "0.4"
thiserror = "2"
ureq = { version = "2", default-features = false, features = ["tls"] }

getrandom = "0.2"

[dev-dependencies]
tempfile = "3"
