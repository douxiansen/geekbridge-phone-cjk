[package]
name = "phone-windows"
description = "Windows Bluetooth transport: paired phones, RFCOMM services and calls through WinRT"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
phone-core = { path = "../phone-core" }
phone-obex = { path = "../phone-obex" }
log = "0.4"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
    "Devices_Bluetooth",
    "Devices_Bluetooth_Rfcomm",
    "Networking",
    "Networking_Sockets",
    "Storage_Streams",
    "Devices_Enumeration",
    "Devices_Radios",
    "ApplicationModel_Calls",
    "Foundation",
    "Foundation_Collections",
    "Foundation_Numerics",
    "Win32_Foundation",
    "Win32_System_LibraryLoader",
    "Win32_Storage_Packaging_Appx",
] }
