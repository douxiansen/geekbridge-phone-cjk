[package]
name = "phone-core"
description = "GeekBridge Phone core: calls, contacts, conversations and the background service, independent of the operating system"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
phone-obex = { path = "../phone-obex" }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
dirs = "6"
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[features]
# A fake phone with invented data, for demos, screenshots and UI development.
demo = ["phone-obex/fake"]

[dev-dependencies]
phone-obex = { path = "../phone-obex", features = ["fake"] }
